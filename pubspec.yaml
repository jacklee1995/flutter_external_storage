name: external_storage
description: "Android & iOS storage plugin: storage volumes (SD card / USB UUID), file and directory operations, file system watching and storage permission handling."
version: 0.1.0
homepage: https://github.com/jacklee1995/flutter_external_storage
repository: https://github.com/jacklee1995/flutter_external_storage
issue_tracker: https://github.com/jacklee1995/flutter_external_storage/issues
topics:
  - storage
  - file
  - sdcard
  - file-manager
  - permissions

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  crypto: ^3.0.6
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  mime: ^2.0.0
  path: ^1.9.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: tech.thispage.external_storage
        pluginClass: ExternalStoragePlugin
      ios:
        pluginClass: ExternalStoragePlugin

screenshots:
  - description: "Flutter external storage logo."
    path: flutter_external_storage.png
